name: Sync BASE products
on:
  schedule:
    - cron: '17 * * * *'   # 毎時17分に実行
  workflow_dispatch:        # 手動トリガーも可能

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch product IDs from BASE sitemap
        id: fetch
        run: |
          IDS=$(curl -s -A "Mozilla/5.0 GitHubActions-nanji2025-sync" https://nanji2025.base.shop/sitemap.xml \
            | grep -oE '/items/[0-9]+' \
            | sed 's|/items/||' \
            | sort -u -r)
          if [ -z "$IDS" ]; then
            echo "::error::No product IDs found in BASE sitemap"
            exit 1
          fi
          ARRAY=$(echo "$IDS" | awk '{printf "    '\''%s'\'',\n", $1}')
          echo "array<<EOF" >> $GITHUB_OUTPUT
          echo "$ARRAY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(echo "$IDS" | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT
      - name: Update product lists
        run: |
          python3 - <<'PY'
          import re, pathlib
          arr = """${{ steps.fetch.outputs.array }}"""
          # 本番は index.html（const 宣言）、プレビューは preview/main.js（var 宣言）。
          # 宣言キーワードが違うのでファイルごとに置換文を変える。
          targets = [
              ('index.html',      '  ', 'const'),
              ('preview/main.js', '  ', 'var'),
          ]
          for name, indent, kw in targets:
              p = pathlib.Path(name)
              if not p.exists():
                  print(f"skip {name} (not found)")
                  continue
              src = p.read_text()
              block = (f"{indent}// NANJI_PRODUCTS_START\n"
                       f"{indent}{kw} NANJI_PRODUCTS = [\n{arr}{indent}];\n"
                       f"{indent}// NANJI_PRODUCTS_END")
              out = re.sub(r'[ ]*// NANJI_PRODUCTS_START.*?// NANJI_PRODUCTS_END',
                           block, src, flags=re.S)
              if out != src:
                  p.write_text(out)
                  print(f"updated {name}")
              else:
                  print(f"no change {name}")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes."
          else
            git add index.html preview/main.js
            git commit -m "Sync BASE products (${{ steps.fetch.outputs.count }} items)"
            git push
          fi
